name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Install tools
        run: |
          brew update
          brew install swiftformat swiftlint periphery gitleaks shellcheck shfmt

      - name: Formatting
        run: make format-check

      - name: Lint
        run: make lint

      - name: Build
        run: make build

      - name: Unused code
        run: make periphery

      - name: Secrets
        run: make secrets

      - name: Shell scripts
        run: make shellcheck

      - name: App bundle
        run: make bundle
