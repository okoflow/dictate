name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans history
      # Package.swift needs Swift 6.2; the image's default Xcode ships an older toolchain.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: swift --version
      - name: Install tools
        run: brew install swiftlint swiftformat gitleaks shellcheck periphery
      - name: make check
        run: make check
