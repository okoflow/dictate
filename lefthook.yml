pre-commit:
  commands:
    format:
      glob: "*.swift"
      run: swiftformat --lint {staged_files}

    lint:
      glob: "*.swift"
      run: make lint

    shell:
      glob: "*.sh"
      run: shfmt -d {staged_files} && shellcheck {staged_files}

    secrets:
      run: gitleaks git --pre-commit --staged --no-banner --redact
