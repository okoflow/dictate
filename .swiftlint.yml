included:
  - Sources
  - Tests

opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional
  - empty_count
  - first_where
  - contains_over_filter_count
  - redundant_nil_coalescing
  - fatal_error_message
  - discouraged_optional_boolean
  - sorted_first_last
  - toggle_bool

cyclomatic_complexity:
  warning: 8
  error: 12
function_body_length:
  warning: 40
  error: 60
file_length:
  warning: 300
  error: 500
type_body_length:
  warning: 200
  error: 350
line_length:
  warning: 130
  error: 160
  ignores_comments: true
trailing_comma:
  mandatory_comma: true
